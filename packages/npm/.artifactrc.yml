$schema: https://raw.githubusercontent.com/zokugun/artifact/v0.11.0/schemas/v3/package.json

upsert:
  .github/**/*.yml:
    if_exists: overwrite

  .github/scripts/get-changelog.js:
    if_exists: remove

  .github/scripts/get-changelog.cjs:
    if_exists: remove

update:
  CHANGELOG.md:
    if_exists: skip

  # package.json:
  #   transforms:
  #     - description: Remove release-it from overrides
  #       jq: 'del(.overrides["release-it"])'

variables:
  REPOSITORY_SLUG: =package.json.repository.url |> toGitUrl |> _.full_name
