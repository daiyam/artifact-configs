$schema: https://raw.githubusercontent.com/zokugun/artifact/v0.11.0/schemas/v3/package.json

upsert:
  .github/scripts/get-changelog.js:
    if_exists: remove

  .github/scripts/get-changelog.cjs:
    if_exists: remove

update:
  CHANGELOG.md:
    if_exists: skip

  package.json:
    filter:
      - main
      - scripts
      - devDependencies

  .github/**/*.yml:
    if_exists: overwrite

  src/document-manager.ts:
    if_exists: overwrite

  src/extension.ts:
    if_missing: skip
    if_exists: skip

  src/commands/*:
    if_missing: skip
    if_exists: skip

  src/utils/*:
    if_exists: overwrite

variables:
  REPOSITORY_SLUG: =package.json.repository.url |> toGitUrl |> _.full_name
