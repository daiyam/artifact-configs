$schema: https://raw.githubusercontent.com/zokugun/artifact/v0.11.0/schemas/v3/package.json

upsert:
  .github/scripts/get-changelog.js:
    rename: .github/scripts/get-changelog.cjs

update:
  CHANGELOG.md:
    if_exists: skip

  package.json:
    filter:
      - main
      - scripts
      - devDependencies
    # transforms:
    #   - description: Remove release-it from overrides
    #     jq: 'del(.overrides["release-it"])'

  .github/**/*.yml:
    if_exists: overwrite

  src/document-manager.ts:
    if_exists: overwrite

  src/extension.ts:
    if_missing: skip
    if_exists: skip

  src/commands/*:
    if_missing: skip
    if_exists: skip

  src/utils/*:
    if_exists: overwrite
